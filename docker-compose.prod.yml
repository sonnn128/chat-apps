services:
  # Infrastructure Services (Kafka, Zookeeper, DBs...) giữ nguyên hoặc trỏ về external service
  # Ở đây tôi giả định các service hạ tầng đã chạy hoặc dùng chung file base.
  # Để đơn giản, file này sẽ tập trung vào các Microservices của chúng ta.
  
  discovery-server:
    image: ${DOCKERHUB_USERNAME}/chatapps-discovery-server:latest
    ports:
      - "8761:8761"
    environment:
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    restart: always

  api-gateway:
    image: ${DOCKERHUB_USERNAME}/chatapps-api-gateway:latest
    ports:
      - "8888:8888"
    env_file:
      - ./.env.prod
    depends_on:
      - discovery-server
    restart: always

  user-service:
    image: ${DOCKERHUB_USERNAME}/chatapps-user-service:latest
    ports:
      - "9006:9006"
    env_file:
      - ./.env.prod

    depends_on:
      - discovery-server
    restart: always

  chat-service:
    image: ${DOCKERHUB_USERNAME}/chatapps-chat-service:latest
    ports:
      - "9002:9002"
    env_file:
      - ./.env.prod

    depends_on:
      - discovery-server
    restart: always

  relationship-service:
    image: ${DOCKERHUB_USERNAME}/chatapps-relationship-service:latest
    ports:
      - "9001:9001"
    env_file:
      - ./.env.prod

    depends_on:
      - discovery-server
    restart: always

  media-service:
    image: ${DOCKERHUB_USERNAME}/chatapps-media-service:latest
    ports:
      - "9004:9004"
    env_file:
      - ./.env.prod

    depends_on:
      - discovery-server
    restart: always

  frontend:
    image: ${DOCKERHUB_USERNAME}/chatapps-frontend:latest
    ports:
      - "3000:3000"
    restart: always

# Networks configuration
networks:
  default:
    external: true
    name: chat-apps_default
