version: '3.8'

services:
  # KAFKA
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper-prod
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - chat-apps-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka-prod
    restart: unless-stopped
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - chat-apps-network

  # DATABASES
  postgres:
    image: postgres:16-alpine
    container_name: postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat-apps-network

  cassandra:
    image: cassandra:4.1
    container_name: cassandra-prod
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      - MAX_HEAP_SIZE=2G
      - HEAP_NEWSIZE=200M
      - CASSANDRA_CLUSTER_NAME=ChatAppsCluster
    healthcheck:
      test: ["CMD", "cqlsh", "-u cassandra", "-p cassandra", "-e describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 10
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - chat-apps-network

  keycloak-mysql:
    image: mysql:8.0
    container_name: keycloak-mysql-prod
    restart: unless-stopped
    volumes:
      - keycloak-mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-strong_root_password}
      MYSQL_DATABASE: ${KEYCLOAK_DB:-keycloak}
      MYSQL_USER: ${MYSQL_USER:-keycloak}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-keycloak_password}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat-apps-network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: keycloak-prod
    command: ["start", "--import-realm"]
    restart: unless-stopped
    depends_on:
      keycloak-mysql:
        condition: service_healthy
    environment:
      KC_DB: mysql
      KC_DB_URL_HOST: keycloak-mysql
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${MYSQL_USER:-keycloak}
      KC_DB_PASSWORD: ${MYSQL_PASSWORD:-keycloak_password}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_password}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-realms/:/opt/keycloak/data/import/
    networks:
      - chat-apps-network

  # CONFIGURATION SERVICES
  discovery-server:
    image: ${DOCKER_REGISTRY:-localhost}/chat-apps-discovery-server:${APP_VERSION:-latest}
    build: 
      context: ./discovery-server
      dockerfile: Dockerfile
    container_name: discovery-server-prod
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - chat-apps-network

  api-gateway:
    image: ${DOCKER_REGISTRY:-localhost}/chat-apps-api-gateway:${APP_VERSION:-latest}
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "8888:8888"
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - chat-apps-network

  # BUSINESS SERVICES
  user-service:
    image: ${DOCKER_REGISTRY:-localhost}/chat-apps-user-service:${APP_VERSION:-latest}
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service-prod
    restart: unless-stopped
    ports:
      - "9005:9005"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-postgres_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      MEDIA_SERVICE: media-service
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9005/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - chat-apps-network

  media-service:
    image: ${DOCKER_REGISTRY:-localhost}/chat-apps-media-service:${APP_VERSION:-latest}
    build:
      context: ./media-service
      dockerfile: Dockerfile
    container_name: media-service-prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
    ports:
      - "9006:9006"
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9006/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - chat-apps-network

  notification-service:
    image: ${DOCKER_REGISTRY:-localhost}/chat-apps-notification-service:${APP_VERSION:-latest}
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service-prod
    restart: unless-stopped
    ports:
      - "8889:8889"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
    depends_on:
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8889/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - chat-apps-network

  chat-service:
    image: ${DOCKER_REGISTRY:-localhost}/chat-apps-chat-service:${APP_VERSION:-latest}
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: chat-service-prod
    restart: unless-stopped
    ports:
      - "9007:9007"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      user-service.url: http://user-service:9005
      channel-service.url: http://channel-service:9008
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
    depends_on:
      discovery-server:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9007/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - chat-apps-network

  channel-service:
    image: ${DOCKER_REGISTRY:-localhost}/chat-apps-channel-service:${APP_VERSION:-latest}
    build:
      context: ./channel-service
      dockerfile: Dockerfile
    container_name: channel-service-prod
    restart: unless-stopped
    ports:
      - "9008:9008"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-postgres_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      user-service.url: http://user-service:9005
      chat-service.url: http://chat-service:9007
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9008/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - chat-apps-network

  friendship-service:
    image: ${DOCKER_REGISTRY:-localhost}/chat-apps-friendship-service:${APP_VERSION:-latest}
    build:
      context: ./friendship-service
      dockerfile: Dockerfile
    container_name: friendship-service-prod
    restart: unless-stopped
    ports:
      - "9009:9009"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-postgres_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      user-service.url: http://user-service:9005
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9009/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - chat-apps-network

  ui:
    image: ${DOCKER_REGISTRY:-localhost}/chat-apps-ui:${APP_VERSION:-latest}
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: ui-prod
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      discovery-server:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      media-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      channel-service:
        condition: service_healthy
      friendship-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    environment:
      VITE_REACT_APP_BASE_URL: ${API_GATEWAY_URL:-http://api-gateway:8888/api/v1}
      VITE_REACT_APP_BASE_WS_URL: ${NOTIFICATION_WS_URL:-http://notification-service:8889/ws}
    networks:
      - chat-apps-network

volumes:
  postgres-data:
    driver: local
  cassandra-data:
    driver: local
  keycloak-mysql-data:
    driver: local
  kafka-data:
    driver: local
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local

networks:
  chat-apps-network:
    driver: bridge
