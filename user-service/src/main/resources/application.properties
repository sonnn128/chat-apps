# Server
server.port=9005
spring.application.name=user-service

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres_db
spring.datasource.username=postgres_user
spring.datasource.password=postgres_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.generate-ddl=true

# Output
spring.output.ansi.enabled=ALWAYS

eureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=${spring.application.name}
eureka.instance.instance-id=${spring.application.name}
# Keycloak Configuration
keycloak.auth-server-url=http://keycloak:8080
keycloak.realm=chat-apps
keycloak.resource=chat-apps-client
keycloak.credentials.secret=e4qQufaOrco7xu7HMEKpLRonaNFlMjGU

# Feign Configuration
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000
feign.client.config.default.loggerLevel=basic

# Media Service Configuration
media.service.name=media-service
media-service.url=http://${MEDIA_SERVICE:localhost}:9006

