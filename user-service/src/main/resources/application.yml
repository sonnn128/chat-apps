server:
  port: 9006
spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:chatapps}
    username: ${POSTGRES_USER:chatapps}
    password: ${POSTGRES_PASSWORD:chatapps}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
    generate-ddl: true
  output:
    ansi:
      enabled: ALWAYS
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KEYCLOAK_HOST:localhost}:8080/realms/chat-apps

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka
  instance:
    prefer-ip-address: true
    hostname: ${spring.application.name}
    instance-id: ${spring.application.name}

keycloak:
  auth-server-url: http://${KEYCLOAK_HOST:localhost}:8080
  realm: chat-apps
  resource: chat-apps-client
  credentials:
    secret: e4qQufaOrco7xu7HMEKpLRonaNFlMjGU

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: basic

media:
  service:
    name: media-service
media-service:
  url: http://${MEDIA_SERVICE:localhost}:9004
