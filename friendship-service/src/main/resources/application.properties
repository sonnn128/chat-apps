# Server
server.port=9007
spring.application.name=friendship-service

# Database: PostgreSQL
spring.cassandra.request.timeout=10s
spring.cassandra.connection.connect-timeout=10s
spring.cassandra.connection.init-query-timeout=10s
logging.level.org.springframework.data.cassandra.core.cql.CqlTemplate=DEBUG

# Output
spring.output.ansi.enabled=ALWAYS

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

# kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

