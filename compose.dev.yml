#      - ./data/redis:/data

  # CONFIGURATION SERVICE
  discovery-server:
    build: ./discovery-server
    # env_file:
    #   - ./.env
    ports:
      - 8761:8761
    healthcheck:
      test: ["CMD", "curl", "-f", "http://discovery-server:8761/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5

