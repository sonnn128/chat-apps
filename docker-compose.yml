version: '3.8'
services:
  discovery-server:
    build: ./discovery-server
    container_name: discovery-server
    ports: ["8761:8761"]
    networks: [microservice-net]
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports: ["8080:8080"]
    depends_on: [discovery-server]
    networks: [microservice-net]
  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    depends_on: [discovery-server]
    networks: [microservice-net]
  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    depends_on: [discovery-server]
    networks: [microservice-net]
  user-service:
    build: ./user-service
    container_name: user-service
    ports: ["8081:8081"]
    depends_on: [discovery-server, postgres]
    networks: [microservice-net]
  friendship-service:
    build: ./friendship-service
    container_name: friendship-service
    ports: ["9009:9009"]
    depends_on: [discovery-server, postgres]
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/friendship_db
      - SPRING_DATASOURCE_USERNAME=dbuser
      - SPRING_DATASOURCE_PASSWORD=dbpassword
    networks: [microservice-net]

  # PostgreSQL for User Service
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: chat_apps
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks: [microservice-net]

  # PostgreSQL for Friendship Service
  postgres-friendship:
    image: postgres:15
    container_name: postgres-friendship
    restart: always
    environment:
      POSTGRES_DB: friendship_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres-friendship:/var/lib/postgresql/data
    networks: [microservice-net]

  keycloak-mysql:
    image: mysql:8.0
    container_name: keycloak-mysql
    restart: always
    volumes:
      - ./data/mysql_keycloak_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: password
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: keycloak
    command: [ "start-dev", "--import-realm" ]
    restart: always
    depends_on:
      keycloak-mysql:
        condition: service_healthy
    environment:
      KC_DB: mysql
      KC_DB_URL_HOST: keycloak-mysql
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-realms/:/opt/keycloak/data/import/
      # - ./keycloak-realms:/opt/keycloak/data/export
# everything in keycloaks is storage in keycloak-mysql
# how to export json file in keycloak
networks:
  microservice-net:
    driver: bridge