# postgres databases
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: postgres_db
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
      # TZ: Asia/Ho_Chi_Minh
      # PGTZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      # - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user"]
      interval: 10s
      timeout: 5s
      retries: 5

# cassandra databases
  cassandra:
    image: cassandra:latest
    ports:
      - "9042:9042"
    healthcheck:
      test: [ "CMD", "cqlsh", "-u cassandra", "-p cassandra", "-e describe keyspaces" ]
      interval: 15s
      timeout: 10s
      retries: 10
    volumes:
      - ./data/cassandra:/var/lib/cassandra

  keycloak-mysql:
    image: mysql:8.0
    container_name: keycloak-mysql
    restart: always
    volumes:
      - ./data/mysql_keycloak_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: password
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: keycloak
    command: [ "start-dev", "--import-realm" ]
    restart: always
    depends_on:
      keycloak-mysql:
        condition: service_healthy
    environment:
      KC_DB: mysql
      KC_DB_URL_HOST: keycloak-mysql
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-realms/:/opt/keycloak/data/import/
      - ./keycloak-realms:/opt/keycloak/data/export
      # - ./keycloak-realms:/opt/keycloak/data/export
      # everything in keycloaks is storage in keycloak-mysql
      # how to export json file in keycloak

#  redis:
#    image: redis:latest
#    restart: unless-stopped
#    ports:
#      - "6380:6379"
#    #      - host-port:container-port(6379)
#    volumes:
#      - ./data/redis:/data

  # CONFIGURATION SERVICE
  discovery-server:
    build: ./discovery-server
    # env_file:
    #   - ./.env
    ports:
      - 8761:8761
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5

  api-gateway:
    build: ./api-gateway
    env_file:
      - ./.env.dev
    ports:
      - 8888:8888
    depends_on:
      discovery-server:
        condition: service_healthy      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    ports:
      - "9005:9005"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres_db
      SPRING_DATASOURCE_USERNAME: postgres_user
      SPRING_DATASOURCE_PASSWORD: postgres_password
      MEDIA_SERVICE: media-service
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9005/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  media-service:
    build:
      context: ./media-service
      dockerfile: Dockerfile
    environment:
      CLOUDINARY_CLOUD_NAME: dswdadh2n
      CLOUDINARY_API_KEY: 741574128814778
      CLOUDINARY_API_SECRET: J9XuHektVDcN5CI_3_58RmDjSoE
    ports:
      - "9006:9006"
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9006/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    ports:
      - "8889:8889"
    depends_on:
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8889/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  chat-service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    ports:
      - "9007:9007"
    environment:
      # Server Configuration
      user-service.url: http://user-service:9005
      channel-service.url: http://channel-service:9008
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
    depends_on:
      discovery-server:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9007/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  channel-service:
    build:
      context: ./channel-service
      dockerfile: Dockerfile
    ports:
      - "9008:9008"
    environment:
      
      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres_db
      SPRING_DATASOURCE_USERNAME: postgres_user
      SPRING_DATASOURCE_PASSWORD: postgres_password
      
      # External Services
      user-service.url: http://user-service:9005
      chat-service.url: http://chat-service:9007
      
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9008/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  friendship-service:
    build:
      context: ./friendship-service
      dockerfile: Dockerfile
    ports:
      - "9009:9009"
    environment:
      
      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres_db
      SPRING_DATASOURCE_USERNAME: postgres_user
      SPRING_DATASOURCE_PASSWORD: postgres_password
      
      # External Services
      user-service.url: http://user-service:9005
      
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9009/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      discovery-server:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      media-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      channel-service:
        condition: service_healthy
      friendship-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    environment:
      VITE_REACT_APP_BASE_URL: http://api-gateway:8888/api/v1
      VITE_REACT_APP_BASE_WS_URL: http://notification-service:8889/ws
      VITE_MEDIA_SERVICE_URL: http://media-service:9006
      VITE_USER_SERVICE_URL: http://user-service:9005
      VITE_CHAT_SERVICE_URL: http://chat-service:9007
      VITE_CHANNEL_SERVICE_URL: http://channel-service:9008
      VITE_FRIENDSHIP_SERVICE_URL: http://friendship-service:9009
      VITE_NOTIFICATION_SERVICE_URL: http://notification-service:8889

