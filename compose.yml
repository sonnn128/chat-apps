      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_HOST: discovery-server
      EUREKA_PORT: 8761
      EUREKA_INSTANCE_HOSTNAME: user-service
      EUREKA_INSTANCE_STATUS_PAGE_URL: http://user-service:9005/actuator/info
      EUREKA_INSTANCE_HEALTH_CHECK_URL: http://user-service:9005/actuator/health
