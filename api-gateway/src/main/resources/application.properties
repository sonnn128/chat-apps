spring.application.name=api-gateway
server.port=8888
spring.output.ansi.enabled=always

# eureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/

eureka.instance.hostname=${spring.application.name}
eureka.instance.instance-id=${spring.application.name}
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.instance.prefer-ip-address=true
#management.endpoints.web.base-path=/actuator
#management.endpoints.web.exposure.include=*
#spring.main.web-application-type=reactive
#
spring.cloud.gateway.discovery.locator.enabled=true
#
spring.cloud.gateway.routes[0].id=PRODUCT-SERVICE
spring.cloud.gateway.routes[0].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/product/**

spring.cloud.gateway.routes[1].id=SHOPPING-CART-SERVICE
spring.cloud.gateway.routes[1].uri=lb://SHOPPING-CART-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/shopping-cart/**

spring.cloud.gateway.routes[2].id=USER-SERVICE
spring.cloud.gateway.routes[2].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/admin/**

spring.cloud.gateway.routes[3].id=CHAT-SERVICE-NOTIFICATIONS
spring.cloud.gateway.routes[3].uri=lb://CHAT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/notifications/**

spring.cloud.gateway.routes[4].id=CHANNEL-SERVICE
spring.cloud.gateway.routes[4].uri=lb://CHANNEL-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/channels/**

spring.cloud.gateway.routes[5].id=CHAT-SERVICE
spring.cloud.gateway.routes[5].uri=lb://CHAT-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/messages/**

spring.cloud.gateway.routes[6].id=FRIENDSHIP-SERVICE
spring.cloud.gateway.routes[6].uri=lb://FRIENDSHIP-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/friendships/**

spring.cloud.gateway.routes[7].id=MEDIA-SERVICE
spring.cloud.gateway.routes[7].uri=lb://MEDIA-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/media/**
#
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/chat-apps
#
spring.cloud.gateway.routes[8].id=CHAT-SERVICE-WS
spring.cloud.gateway.routes[8].uri=lb://CHAT-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/ws,/ws/**

# Logging levels (suppress noisy WS close-code 1005 onErrorDropped stacktraces)
logging.level.reactor.core.publisher.Operators=OFF
logging.level.reactor.netty.http.server.WebsocketServerOperations=OFF
logging.level.reactor.netty.http.client.WebsocketClientOperations=OFF
logging.level.org.springframework.web.reactive.socket.adapter.ReactorNettyWebSocketSession=OFF
logging.level.io.netty.handler.codec.http.websocketx=ERROR
