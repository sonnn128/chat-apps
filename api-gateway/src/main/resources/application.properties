spring.application.name=api-gateway
server.port=8888
spring.output.ansi.enabled=always

eureka.instance.hostname=${spring.application.name}
eureka.instance.instance-id=${spring.application.name}
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.discovery.locator.enabled=true

spring.cloud.gateway.routes[0].id=USER-SERVICE
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/admin/**, /api/v1/me/**

spring.cloud.gateway.routes[1].id=CHAT-SERVICE-NOTIFICATIONS
spring.cloud.gateway.routes[1].uri=lb://CHAT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/notifications/**

spring.cloud.gateway.routes[2].id=RELATIONSHIP-SERVICE
spring.cloud.gateway.routes[2].uri=lb://RELATIONSHIP-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/channels/**

spring.cloud.gateway.routes[3].id=CHAT-SERVICE
spring.cloud.gateway.routes[3].uri=lb://CHAT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/messages/**

spring.cloud.gateway.routes[4].id=RELATIONSHIP-SERVICE-FRIENDSHIPS
spring.cloud.gateway.routes[4].uri=lb://RELATIONSHIP-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/friendships/**

spring.cloud.gateway.routes[5].id=MEDIA-SERVICE
spring.cloud.gateway.routes[5].uri=lb://MEDIA-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/media/**

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${KEYCLOAK_HOST:localhost}:8080/realms/chat-apps

spring.cloud.gateway.routes[6].id=CHAT-SERVICE-WS
spring.cloud.gateway.routes[6].uri=lb://CHAT-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/ws,/ws/**

logging.level.reactor.core.publisher.Operators=OFF
logging.level.reactor.netty.http.server.WebsocketServerOperations=OFF
logging.level.reactor.netty.http.client.WebsocketClientOperations=OFF
logging.level.org.springframework.web.reactive.socket.adapter.ReactorNettyWebSocketSession=OFF
logging.level.io.netty.handler.codec.http.websocketx=ERROR
